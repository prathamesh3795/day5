<!DOCTYPE html>
<html>
<head>
    <title>13f - Twitter Layout</title>
    <link rel="stylesheet" href="13f.css">
</head>

<body>

    <div class="tweet">

        <img class="avatar" src="cat.jpg">

        <div class="content">

            <div class="header">

                <span class="username">
                    supersimple.dev
                </span>

                <span class="handle">
                    @SuperSimpleDev
                </span>

            </div>

            <div class="tweet-text">
                What is backend web development? A complete
                overview. New video is up!
            </div>

            <div class="youtube-card">

                <div class="thumbnail"></div>

                <div class="video-info">

                    <div class="website">
                        youtube.com
                    </div>

                    <div class="video-title">
                        Backend web development - a complete
                        overview (2021)
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
