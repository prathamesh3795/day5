<!DOCTYPE html>
<html>
<head>
    <title>13c - Gmail Layout</title>
    <link rel="stylesheet" href="13c.css">
</head>

<body>

    <div class="email">

        <div class="inbox">ALL INBOXES</div>

        <div class="message">

            <img class="avatar" src="cat.jpg">

            <div class="message-info">

                <div class="name">Chewy Promotions</div>

                <div class="subject">
                    Biggest sales of the year!
                </div>

                <div class="preview">
                    Hey there! We're writing to tell you about our...
                </div>

            </div>

            <div class="time">4:58 PM</div>

        </div>

    </div>

</body>
</html>
